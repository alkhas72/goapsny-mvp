name: Security

# Копия общей проверки ais-scripts/.github/workflows/security-scan.yml:
# этот репозиторий публичный, а публичный репозиторий не может вызывать
# workflow из закрытого. При изменении общей проверки — обновить и здесь.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e "GIT_CONFIG_VALUE_0=*" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --no-banner --redact

      - name: Dangerous code (semgrep)
        if: always()
        env:
          # Хэш bcrypt — не секрет: в тестах лежат хэши синтетических паролей.
          EXCLUDE_RULES: generic.secrets.security.detected-bcrypt-hash.detected-bcrypt-hash
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          for rule in $EXCLUDE_RULES; do args+=(--exclude-rule "$rule"); done
          # В PR красным становится только новое; по расписанию — весь код.
          if [ -n "$BASE_SHA" ]; then args+=(--baseline-commit "$BASE_SHA"); fi
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198 \
            sh -c 'git config --global --add safe.directory /src && semgrep scan \
              --config p/security-audit --config p/owasp-top-ten --config p/secrets \
              --severity ERROR --error --metrics off "$@"' sh "${args[@]}"

      - name: Dependencies and config (trivy)
        if: always()
        run: |
          docker run --rm -v "$PWD:/repo" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs /repo --scanners vuln,misconfig --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --no-progress
